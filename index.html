<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08261b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="GymTrack: absen latihan harian, animasi gerakan, dan rekap progres gym. Gratis, tanpa password, data tersimpan di HP kamu.">
<title>GymTrack — Absen & Rekap Latihan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08261b; --bg2:#0b3123; --card:#0f3a29; --card2:#14472f; --line:rgba(255,255,255,.09);
  --text:#f1fbf5; --mut:#97c2ab; --y:#FFD23F; --m:#8CF5B8; --danger:#ff7a6b;
  --leg:#FFD23F; --chest:#FF7A6B; --back:#6FC3FF; --arm:#8CF5B8; --rest:#8aa196;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100dvh;background:radial-gradient(900px 500px at 50% -10%,#14543a 0%,transparent 60%),var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack>*+*{margin-top:12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 12px}
.brand{font-weight:700;letter-spacing:.2px;font-size:18px}
.brand b{color:var(--y)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--y);color:#10301f;display:grid;place-items:center;font-weight:700}

/* cards */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:var(--card)}
.title{font-size:20px;font-weight:700;line-height:1.25}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--y);color:#10301f;font-weight:700;border:0}
.btn.block{display:flex;width:100%}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--text);font-weight:600}
.btn.danger{background:rgba(255,122,107,.14);color:var(--danger)}
.btn.sm{padding:8px 12px;border-radius:12px;font-size:13px}
.btn:active{transform:scale(.98)}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);font-size:12px;color:var(--text)}
.chip.y{background:rgba(255,210,63,.16);color:var(--y)}

/* inputs */
label.f{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 6px;font-weight:500}
input[type=text],input[type=number],select{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.22);outline:none}
input:focus,select:focus{border-color:var(--y)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}

/* onboarding */
.hero{padding:calc(40px + env(safe-area-inset-top)) 0 18px;text-align:center}
.hero .logo{width:64px;height:64px;border-radius:20px;background:var(--y);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 10px 30px rgba(255,210,63,.25)}
.hero h1{font-size:28px;font-weight:700}
.hero h1 b{color:var(--y)}
.profiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pchip{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.pchip .avatar{width:28px;height:28px;font-size:13px}

/* check-in */
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.pick:active{background:rgba(255,255,255,.12)}
.pick .dot{width:12px;height:42px;border-radius:6px;flex:none}
.pick b{display:block;font-weight:600}
.pick small{color:var(--mut);font-size:12px}
.picks{display:grid;gap:8px;margin-top:12px}
.done{border-left:5px solid var(--c,var(--y))}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 10px;text-align:center}
.stat .v{font-size:24px;font-weight:700;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:11px;color:var(--mut)}
.week .c{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(255,255,255,.06);color:var(--mut);margin-top:4px;max-width:42px;margin-inline:auto}
.week .c.on{color:#10301f}
.week .c.today{outline:2px solid var(--y);outline-offset:2px}

/* nav */
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,38,27,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:500;border-radius:12px}
.nav button.on{color:var(--y)}
.nav svg{width:24px;height:24px}

/* lists */
.daycard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--r);background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);position:relative;overflow:hidden}
.daycard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.daycard .n{font-size:17px;font-weight:700}
.exitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.exitem .th{width:92px;flex:none;background:rgba(0,0,0,.2);border-radius:12px}
.exitem .nm{font-weight:600;line-height:1.25}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);padding:6px 0;font-weight:500}

/* figure */
svg.fig{width:100%;height:auto;display:block}
.fig .fl{stroke:rgba(255,255,255,.2);stroke-width:2}
.fig .sc{stroke:#5f9a80;stroke-width:3;fill:none;stroke-linecap:round}
.fig .sc .t7{stroke-width:7}
.fig .sc .t4{stroke-width:4}
.fig .lg,.fig .to,.fig .bk{stroke:#eafff3;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .bk{opacity:.38}
.fig .hd{fill:var(--bg2);stroke:#eafff3;stroke-width:3.5}
.fig .ar{stroke:var(--y);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .pr{fill:var(--bg);stroke:var(--y);stroke-width:2.5}
.fig .cab{stroke:rgba(255,255,255,.45);stroke-width:1.5;stroke-dasharray:3 2}
.fig .pul{fill:var(--bg2);stroke:#5f9a80;stroke-width:2.5}
.fig .pl{stroke:#5f9a80;stroke-width:5;stroke-linecap:round}
.stage{position:relative;height:min(76vw,330px);border-radius:14px;overflow:hidden}
.stage svg.fig{height:100%}
.stage .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--mut);pointer-events:none}
.vseg{display:flex;gap:6px;margin-top:8px}
.vseg button{flex:1;padding:7px 0;border-radius:11px;background:rgba(255,255,255,.07);font-size:12.5px;font-weight:600}
.vseg button.on{background:var(--y);color:#10301f}
.figbox{background:radial-gradient(120px 90px at 50% 40%,rgba(140,245,184,.10),transparent 70%),rgba(0,0,0,.24);border-radius:18px;border:1px solid var(--line);padding:6px 8px}

/* full panel */
.panel{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.panel .in{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 120px}
.sethead,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center}
.sethead{font-size:11.5px;color:var(--mut);padding:0 0 4px}
.setrow{margin-top:8px}
.setrow .n{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:12.5px;font-weight:600}
.setrow input{padding:10px 8px;text-align:center}
.setrow .x{width:36px;height:36px;border-radius:10px;color:var(--danger);background:rgba(255,122,107,.1);font-size:18px}
ul.tips{padding-left:18px;margin:8px 0 0}
ul.tips li{margin:5px 0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{width:min(100%,480px);background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.modal .grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:-6px auto 14px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--mut);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;font-weight:500;color:var(--mut);position:relative}
.cal button.e{background:transparent;pointer-events:none}
.cal button.on{color:#10301f;font-weight:700}
.cal button.today{outline:2px solid var(--y);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}

/* timer & toast */
.timer{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:80;display:none;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:99px;background:var(--y);color:#10301f;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.timer.on{display:flex}
.timer button{padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.14);font-weight:700;font-size:12.5px;color:#10301f}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top));z-index:90;background:#0b2e21;border:1px solid var(--y);color:var(--text);padding:10px 16px;border-radius:14px;font-size:13.5px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 0;border-radius:11px;background:rgba(255,255,255,.07);font-size:13px;font-weight:600}
.seg button.on{background:var(--y);color:#10301f}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>
<div id="timer" class="timer"><span id="tm">1:30</span><button data-a="timerAdd">+15s</button><button data-a="timerStop">Stop</button></div>
<div id="toast" class="toast"></div>

/* ================= figure engine ================= */
function lerp(a,b,t){if(Array.isArray(a))return a.map(function(v,i){return lerp(v,b[i],t)});if(typeof a==='number')return a+(b-a)*t;return a}
function mix(A,B,t){var o={};for(var k in A){o[k]=(k in B)?lerp(A[k],B[k],t):A[k]}return o}
function fk(p){
  var R=Math.PI/180;
  function v(a,l){return [Math.cos(a*R)*l,Math.sin(a*R)*l]}
  var T=v(p.tor,40),U=v(p.ua,21),F=v(p.fa,21),Th=v(p.th,29),Sh=v(p.sh,29),hip;
  if(p.hip)hip=p.hip.slice();
  else if(p.foot)hip=[p.foot[0]-Th[0]-Sh[0],p.foot[1]-Th[1]-Sh[1]];
  else hip=[p.wrist[0]-U[0]-F[0]-T[0],p.wrist[1]-U[1]-F[1]-T[1]];
  var S=[hip[0]+T[0],hip[1]+T[1]],E=[S[0]+U[0],S[1]+U[1]],W=[E[0]+F[0],E[1]+F[1]];
  var K=[hip[0]+Th[0],hip[1]+Th[1]],A=[K[0]+Sh[0],K[1]+Sh[1]];
  var fv=v(p.ft==null?15:p.ft,8),Tt=[A[0]+fv[0],A[1]+fv[1]];
  var H=[S[0]+Math.cos(p.tor*R)*13,S[1]+Math.sin(p.tor*R)*13];
  var r={hip:hip,S:S,E:E,W:W,K:K,A:A,Tt:Tt,H:H};
  if(p.th2!=null){var t2=v(p.th2,29),s2=v(p.sh2,29);r.K2=[hip[0]+t2[0],hip[1]+t2[1]];r.A2=[r.K2[0]+s2[0],r.K2[1]+s2[1]]}
  return r;
}
function pts(a){return a.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')}
function fig(id,cls){
  var e=EX[id],c='';
  c+='<svg class="fig '+(cls||'')+'" data-ex="'+id+'" viewBox="0 -14 200 160" role="img" aria-label="Animasi gerakan '+esc(e.n)+'">';
  c+='<line class="fl" x1="8" y1="'+(FLOOR+2)+'" x2="192" y2="'+(FLOOR+2)+'"/>';
  c+=e.scene||'';
  if(e.cable)c+='<circle class="pul" cx="'+e.cable[0]+'" cy="'+e.cable[1]+'" r="4"/><line class="cab"/>';
  c+='<polyline class="bk"/><polyline class="lg"/><polyline class="to"/><circle class="hd" r="7"/>';
  if(e.plate!=null)c+='<line class="pl"/>';
  c+='<polyline class="ar"/>';
  if(e.prop)c+='<circle class="pr" r="'+e.prop.r+'"/>';
  return c+'</svg>';
}
var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function phase(t){
  var T=2.9,u=(t%T)/T,tri=u<.5?u*2:(1-u)*2;
  var q=Math.min(1,Math.max(0,(tri-.07)/.86));
  return q*q*(3-2*q);
}
function drawFig(svg,p){
  var e=EX[svg.getAttribute('data-ex')];if(!e)return;
  var c=svg._c;
  if(!c){c=svg._c={bk:svg.querySelector('.bk'),lg:svg.querySelector('.lg'),to:svg.querySelector('.to'),hd:svg.querySelector('.hd'),ar:svg.querySelector('.ar'),pr:svg.querySelector('.pr'),pl:svg.querySelector('.pl'),cab:svg.querySelector('.cab')}}
  var pose=mix(e.A,e.B,p),j=fk(pose);
  if(e.toeFloor)j.Tt=[j.A[0]+8,FLOOR];
  c.lg.setAttribute('points',pts([j.hip,j.K,j.A,j.Tt]));
  c.to.setAttribute('points',pts([j.hip,j.S]));
  c.ar.setAttribute('points',pts([j.S,j.E,j.W]));
  c.hd.setAttribute('cx',j.H[0].toFixed(1));c.hd.setAttribute('cy',j.H[1].toFixed(1));
  if(j.K2){c.bk.setAttribute('points',pts([j.hip,j.K2,j.A2,[j.A2[0]+8,j.A2[1]+2]]))}else{c.bk.setAttribute('points','')}
  if(c.pr){var q=e.prop,pp=q.at==='S'?[j.S[0]+(q.dx||0),j.S[1]+(q.dy||0)]:q.at==='A'?j.A:j.W;c.pr.setAttribute('cx',pp[0].toFixed(1));c.pr.setAttribute('cy',pp[1].toFixed(1))}
  if(c.pl){var a=e.plate*Math.PI/180,dx=Math.cos(a)*15,dy=Math.sin(a)*15;c.pl.setAttribute('x1',(j.A[0]-dx).toFixed(1));c.pl.setAttribute('y1',(j.A[1]-dy).toFixed(1));c.pl.setAttribute('x2',(j.A[0]+dx).toFixed(1));c.pl.setAttribute('y2',(j.A[1]+dy).toFixed(1))}
  if(c.cab){c.cab.setAttribute('x1',e.cable[0]);c.cab.setAttribute('y1',e.cable[1]);c.cab.setAttribute('x2',j.W[0].toFixed(1));c.cab.setAttribute('y2',j.W[1].toFixed(1))}
}
function tick(ms){
  var t=ms/1000,p=reduce?0:phase(t),list=document.querySelectorAll('svg.fig');
  for(var i=0;i<list.length;i++)drawFig(list[i],list[i].getAttribute('data-fixed')!=null?parseFloat(list[i].getAttribute('data-fixed')):p);
  requestAnimationFrame(tick);
}

/* ================= helpers: stats ================= */
function dayInfo(k){return DAYS[k]||DAYS.rest}
function streak(){
  var c=P().checkins,cur=0,d=new Date();
  if(!c[ymd(d)])d=addDays(d,-1);
  while(c[ymd(d)]){cur++;d=addDays(d,-1)}
  var keys=Object.keys(c).sort(),best=0,run=0,prev=null;
  keys.forEach(function(k){run=(prev&&dayDiff(prev,k)===1)?run+1:1;if(run>best)best=run;prev=k});
  return {cur:cur,best:best};
}
function sessions(from,to){var n=0,c=P().checkins;for(var k in c){if(c[k].d!=='rest'&&(!from||k>=from)&&(!to||k<=to))n++}return n}
function weekStart(d){return addDays(d,-dowIdx(d))}
function latestWeight(){var w=P().weights;return w.length?w[w.length-1].kg:0}
function bmi(){var h=P().height/100,w=latestWeight();return h>0?w/(h*h):0}
function bmiCat(b){return b<18.5?'Kurus':b<25?'Normal':b<30?'Berlebih':'Obesitas'}
function lastSets(exId,beforeToday){
  var logs=P().logs,dates=Object.keys(logs).sort().reverse(),today=ymd();
  for(var i=0;i<dates.length;i++){var d=dates[i];if(beforeToday&&d>=today)continue;var s=logs[d][exId];if(s&&s.length)return {date:d,sets:s}}
  return null;
}
function topSet(sets){var b=null;sets.forEach(function(s){if(!b||num(s.kg)>num(b.kg)||(num(s.kg)===num(b.kg)&&num(s.reps)>num(b.reps)))b=s});return b}
function setTxt(s){var kg=num(s.kg),r=num(s.reps);return (kg?fmtN(kg)+' kg':'BB')+' × '+(r||'–')}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(ui.toastT);ui.toastT=setTimeout(function(){t.classList.remove('on')},2200)}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext,a=new C(),i;for(i=0;i<3;i++){(function(i){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.25);o.stop(a.currentTime+i*.25+.15)})(i)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function timerTick(){
  var left=Math.max(0,Math.ceil((timer.end-Date.now())/1000)),el=document.getElementById('tm');
  el.textContent=Math.floor(left/60)+':'+pad(left%60);

/* ================= charts ================= */
function lineChart(points,unit,color){
  var W=320,H=160,L=36,R=12,T=14,B=26;
  if(!points.length)return '';
  var ys=points.map(function(p){return p.y}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  if(mn===mx){mn-=1;mx+=1}
  var pd=(mx-mn)*.15;mn-=pd;mx+=pd;
  function X(i){return points.length===1?(L+(W-L-R)/2):L+(W-L-R)*i/(points.length-1)}
  function Y(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn))}
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  for(var g=0;g<4;g++){var gv=mn+(mx-mn)*g/3,gy=Y(gv);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="rgba(255,255,255,.08)"/><text x="'+(L-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="#97c2ab">'+fmtN(gv)+'</text>'}
  var d=points.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)}).join(' ');
  if(points.length>1)s+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  points.forEach(function(p,i){s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.6" fill="'+color+'"/>'});
  var a=points[0].x,b=points[points.length-1].x;
  s+='<text x="'+L+'" y="'+(H-6)+'" font-size="10" fill="#97c2ab">'+esc(a)+'</text>';
  if(points.length>1)s+='<text x="'+(W-R)+'" y="'+(H-6)+'" font-size="10" fill="#97c2ab" text-anchor="end">'+esc(b)+'</text>';
  return s+'</svg>';
}

  timerPref:function(el){var s=+el.dataset.s;if(s===0)timer.auto=false;else{timer.auto=true;timer.dur=s}render()},
  month:function(el){var m=ui.month,n=+el.dataset.n;m.m+=n;if(m.m<0){m.m=11;m.y--}if(m.m>11){m.m=0;m.y++}render()},
  calDate:function(el){var d=el.dataset.date;if(d>ymd()){toast('Belum bisa absen untuk hari yang belum tiba');return}dayModal(d,'Atur latihan')},
  setDate:function(el){var p=P();p.checkins[el.dataset.date]={d:el.dataset.d,t:Date.now()};save();closeModal();render();toast('Tersimpan ✓')},
  delDate:function(el){delete P().checkins[el.dataset.date];save();closeModal();render()},
  weightModal:function(){weightModal()},
  saveWeight:function(){
    var v=num(document.getElementById('wv').value);
    if(v<25||v>300){document.getElementById('merr').textContent='Masukkan berat antara 25–300 kg';return}
    var w=P().weights,t=ymd(),f=w.filter(function(x){return x.date===t})[0];
    if(f)f.kg=v;else w.push({date:t,kg:v});
    w.sort(function(a,b){return a.date<b.date?-1:1});
    save();closeModal();render();toast('Berat tersimpan ✓');
  },
  logout:function(){DB.current=null;save();render()},
  export:function(){
    var blob=new Blob([JSON.stringify({app:'gymtrack',v:1,profile:P()},null,1)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='gymtrack-'+P().username+'-'+ymd()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);toast('File cadangan diunduh');
  },
  resetLogs:function(){if(confirm('Hapus semua absen dan catatan beban? Tidak bisa dibatalkan.')){var p=P();p.checkins={};p.logs={};save();render();toast('Riwayat dihapus')}},
  delProfile:function(){if(confirm('Hapus profil @'+DB.current+' beserta semua datanya?')){delete DB.profiles[DB.current];DB.current=null;save();render()}}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;
  var f=A[el.dataset.a];if(f){f(el,e);
    var pn=document.getElementById('panel');if(!ui.panel&&pn)pn.remove()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.a==='progSel'){ui.progEx=t.value;render();return}
  if(t.id==='imp'&&t.files&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result),p=o.profile;
        if(o.app!=='gymtrack'||!p||!/^[a-z0-9_.]{3,20}$/.test(p.username||'')||!p.checkins||!p.logs||!Array.isArray(p.weights))throw 0;
        if(DB.profiles[p.username]&&!confirm('Profil @'+p.username+' sudah ada. Timpa dengan data dari file?'))return;
        DB.profiles[p.username]=p;DB.current=p.username;save();ui.tab='home';render();toast('Import berhasil ✓');
      }catch(err){toast('File tidak valid')}
    };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f&&ui.panel){
    var p=P(),s=p.logs[ymd()]&&p.logs[ymd()][ui.panel.ex];
    if(s&&s[+t.dataset.i]){s[+t.dataset.i][t.dataset.f]=t.value;save()}
  }
});
function bindForms(){
  var f=document.getElementById('f-new');
  if(f)f.addEventListener('submit',function(e){
    e.preventDefault();
    var u=f.u.value.trim().toLowerCase(),n=f.n.value.trim().replace(/\s+/g,' '),h=num(f.h.value),w=num(f.w.value),er=document.getElementById('err');
    if(!/^[a-z0-9_.]{3,20}$/.test(u)){er.textContent='Username 3–20 karakter: huruf kecil, angka, titik, atau underscore';return}
    if(DB.profiles[u]){er.textContent='Username sudah dipakai di HP ini. Pilih "Lanjut sebagai" di atas';return}
    if(n.length<2){er.textContent='Isi nama lengkap kamu';return}
    if(h<100||h>250){er.textContent='Tinggi harus antara 100–250 cm';return}
    if(w<25||w>300){er.textContent='Berat harus antara 25–300 kg';return}
    DB.profiles[u]=newProfile(u,n,h,w);DB.current=u;save();ui.tab='home';ui.day=null;ui.month=null;render();window.scrollTo(0,0);
  });
  var g=document.getElementById('f-prof');
  if(g)g.addEventListener('submit',function(e){
    e.preventDefault();
    var n=g.n.value.trim().replace(/\s+/g,' '),h=num(g.h.value),w=num(g.w.value),er=document.getElementById('err'),p=P();
    if(n.length<2){er.textContent='Isi nama lengkap kamu';return}
    if(h<100||h>250){er.textContent='Tinggi harus antara 100–250 cm';return}
    if(w<25||w>300){er.textContent='Berat harus antara 25–300 kg';return}
    p.name=n;p.height=h;
    if(w!==latestWeight()){var t=ymd(),f=p.weights.filter(function(x){return x.date===t})[0];if(f)f.kg=w;else p.weights.push({date:t,kg:w})}
    save();render();toast('Profil tersimpan ✓');
  });
}

/* ================= boot ================= */
load();render();requestAnimationFrame(tick);
window.GT={EX:EX,fk:fk,drawFig:drawFig,fig:fig,DB:function(){return DB},ymd:ymd};
})();
</script>
</body>
